schema_version: 2
id: m13_bucket3_binary_bd_and_lead_a
title: M1.3 Bucket 3 BD AND collider with BK-leading isolated A
description: >-
  Four-variable observational causal Bayesian network: B and D are mutually
  independent non-degenerate stochastic roots of deterministic collider C = B AND D,
  with an additional isolated independent root A ~ Bernoulli(1/2) that has no edges.
  Internal names a, b, c, d; display (A,B,C,D). Variable order places a first so that
  for target c the exact-value BK predictors are a, then b, then d (BK-leading distractor).
  Evaluator-only fixture for H3; not an ABA Learning claim.

variables:
  - name: a
    states: [0, 1]
  - name: b
    states: [0, 1]
  - name: c
    states: [0, 1]
  - name: d
    states: [0, 1]

graph:
  edges:
    - [b, c]
    - [d, c]

mechanisms:
  a:
    parents: []
    cpt:
      - when: {}
        probabilities: ["1/2", "1/2"]

  b:
    parents: []
    cpt:
      - when: {}
        probabilities: ["1/5", "4/5"]

  c:
    parents: [b, d]
    cpt:
      - when: {b: 0, d: 0}
        probabilities: [1, 0]
      - when: {b: 0, d: 1}
        probabilities: [1, 0]
      - when: {b: 1, d: 0}
        probabilities: [1, 0]
      - when: {b: 1, d: 1}
        probabilities: [0, 1]

  d:
    parents: []
    cpt:
      - when: {}
        probabilities: ["3/10", "7/10"]

assumptions:
  mechanism_regime: root_stochastic_deterministic_nonroots
  causal_sufficiency:
    declared: true
    exogenous_noise: mutually_independent_root_exogenous_noise
  observational_sampling:
    regime: observational_iid

metadata:
  milestone: M1.3
  bucket: 3
  motif: collider_with_bk_leading_isolated_root
  mechanism: deterministic_and
  probe: H3
  display_variables: [A, B, C, D]
  target_visible_to_generator: false
  faithfulness_is_derived_not_declared: true
