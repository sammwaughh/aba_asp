schema_version: 2
id: m2_support_and_collider
title: M2 exhaustive-support binary AND collider
description: >-
  Three-variable schema-2 fixture with independent roots A and B and
  deterministic C = A AND B. The learning table is the handwritten four-row
  truth table over the roots, not an IID sample.

variables:
  - name: a
    states: [0, 1]
  - name: b
    states: [0, 1]
  - name: c
    states: [0, 1]

graph:
  edges:
    - [a, c]
    - [b, c]

mechanisms:
  a:
    parents: []
    cpt:
      - when: {}
        probabilities: ["1/2", "1/2"]

  b:
    parents: []
    cpt:
      - when: {}
        probabilities: ["1/2", "1/2"]

  c:
    parents: [a, b]
    cpt:
      - when: {a: 0, b: 0}
        probabilities: [1, 0]
      - when: {a: 0, b: 1}
        probabilities: [1, 0]
      - when: {a: 1, b: 0}
        probabilities: [1, 0]
      - when: {a: 1, b: 1}
        probabilities: [0, 1]

assumptions:
  mechanism_regime: root_stochastic_deterministic_nonroots
  causal_sufficiency:
    declared: true
    exogenous_noise: mutually_independent_root_exogenous_noise
  observational_sampling:
    regime: observational_iid

metadata:
  milestone: M2
  motif: collider
  mechanism: deterministic_and
  table: exhaustive_root_support
  display_variables: [A, B, C]
  target_visible_to_generator: false
  faithfulness_is_derived_not_declared: true
