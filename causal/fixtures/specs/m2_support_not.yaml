schema_version: 2
id: m2_support_not
title: M2 exhaustive-support binary NOT
description: >-
  Two-variable schema-2 fixture with stochastic root A and deterministic
  B := NOT A. The learning table is the handwritten two-row truth table over
  the root, not an IID sample.

variables:
  - name: a
    states: [0, 1]
  - name: b
    states: [0, 1]

graph:
  edges:
    - [a, b]

mechanisms:
  a:
    parents: []
    cpt:
      - when: {}
        probabilities: ["1/2", "1/2"]

  b:
    parents: [a]
    cpt:
      - when: {a: 0}
        probabilities: [0, 1]
      - when: {a: 1}
        probabilities: [1, 0]

assumptions:
  mechanism_regime: root_stochastic_deterministic_nonroots
  causal_sufficiency:
    declared: true
    exogenous_noise: mutually_independent_root_exogenous_noise
  observational_sampling:
    regime: observational_iid

metadata:
  milestone: M2
  motif: two_node
  mechanism: deterministic_not
  table: exhaustive_root_support
  display_variables: [A, B]
  target_visible_to_generator: false
  faithfulness_is_derived_not_declared: true
