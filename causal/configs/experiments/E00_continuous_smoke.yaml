experiment_id: E00_continuous_smoke
description: "Continuous mirror of E00_discrete_smoke: same 3-node DGPs, n=6, seeds 0-3, all targets. Only change is linear Gaussian SCM + quantile binning + median E+/E- (original causal/ continuous track)."
owner: sam

defaults:
  graph_type: continuous
  noise_type: gaussian
  bins: 2
  bin_strategy: quantile
  example_split: median
  folding_steps: 10
  folding_mode: nd
  prolog_timeout_s: 45
  query_timeout_s: 5

dgps:
  - id: G3-chain
    nodes: 3
    edges: [[0, 1], [1, 2]]
  - id: G3-fork
    nodes: 3
    edges: [[0, 1], [0, 2]]
  - id: G3-collider
    nodes: 3
    edges: [[0, 2], [1, 2]]

grid:
  n: [6]
  seed: { range: [0, 4] }   # seeds 0..3 (4 total)
  target: all

provenance:
  code_commit_required: true
