experiment_id: M12x_ecai2024
description: "Expanded M1.2 (M12x) arm ECAI: configs/ecai2024_config.pl on units U1–U7 (mechanism cards). Deterministic categorical mechanisms; k=3; nonzero-positive labels; val-only BK; learning targets as locked on cards (not always every non-source); descendants kept in BK as distractors. Unguided ABA Learning rule recovery, NOT Russo-style Causal ABA."
owner: sam

defaults:
  graph_type: handcrafted_table
  bins: 3
  bin_strategy: uniform
  prolog_timeout_s: 60
  query_timeout_s: 5
  prolog_config: configs/ecai2024_config.pl

dgps:
  - id: m12_u1_separator_copy
    graph_type: handcrafted_table
    source: m12_u1_separator_copy
    targets: [x2]
  - id: m12_u2_collider_min
    graph_type: handcrafted_table
    source: m12_u2_collider_min
    targets: [x2]
  - id: m12_u3_collider_max
    graph_type: handcrafted_table
    source: m12_u3_collider_max
    targets: [x2]
  - id: m12_u4_fork_asymmetric
    graph_type: handcrafted_table
    source: m12_u4_fork_asymmetric
    targets: [x1, x2]
  - id: m12_u5_chain_curated
    graph_type: handcrafted_table
    source: m12_u5_chain_curated
    targets: [x2]
  - id: m12_u6_g1_min_diff
    graph_type: handcrafted_table
    source: m12_u6_g1_min_diff
    targets: [x2, x3]
  - id: m12_u7_diamond_noisy
    graph_type: handcrafted_table
    source: m12_u7_diamond_noisy
    targets: [x3]

grid:
  # No seed: deterministic handcrafted tables (omit grid.seed entirely).
  # Ignored when DGP entries set targets; required by schema.
  target: [x2]
  cell_dir: slug

provenance:
  code_commit_required: true
