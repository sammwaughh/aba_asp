experiment_id: E00_discrete_smoke
description: "Discrete baseline smoke test: 3-node DGPs, n=8, seeds 0-3, all targets. Matches test_aba_learning.py regime (pick_target_variable split, folding_steps=15, prolog_timeout_s=120)."
owner: sam

defaults:
  graph_type: discrete
  bins: 2
  bin_strategy: quantile
  example_split: pick_target_variable
  folding_steps: 15
  folding_mode: nd
  prolog_timeout_s: 120
  query_timeout_s: 5

dgps:
  - id: G3-chain
    nodes: 3
    edges: [[0, 1], [1, 2]]
  - id: G3-fork
    nodes: 3
    edges: [[0, 1], [0, 2]]
  - id: G3-collider
    nodes: 3
    edges: [[0, 2], [1, 2]]

grid:
  n: [8]
  seed: { range: [0, 4] }   # seeds 0..3 (4 total)
  target: all

provenance:
  code_commit_required: true
