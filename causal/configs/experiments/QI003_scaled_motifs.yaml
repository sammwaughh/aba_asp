    graph_type: handcrafted_table
    source: qi003_chain_x0parent_cat3
  - id: qi003_chain_x0parent_cont3
    graph_type: handcrafted_table
    source: qi003_chain_x0parent_cont3
  - id: qi003_fork_x0parent_binary
