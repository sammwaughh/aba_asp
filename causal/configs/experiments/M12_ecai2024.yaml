experiment_id: M12_ecai2024
description: "M1.2 arm ECAI (ASP-ABAlearnB): the shipped configs/ecai2024_config.pl consulted verbatim (brave, nd folding, folding_steps 10, selection any, space all, asm_intro relto, check_ic), run one-shot on the five divergence-designed categorical fixtures (m12_sep/conj/disj/fork/chain). Feature-BK + E+/E- construction (matches ecai2024/ASP-ABAlearn_B/*.csv.bk.aba). Timeout 60 s. Recovery of mechanism-aligned rules via unguided ABA Learning, NOT Russo-style Causal ABA."
owner: sam

defaults:
  graph_type: handcrafted_table
  bins: 3
  bin_strategy: uniform
  prolog_timeout_s: 60
  query_timeout_s: 5
  prolog_config: configs/ecai2024_config.pl

dgps:
  - id: m12_sep
    graph_type: handcrafted_table
    source: m12_sep
  - id: m12_conj
    graph_type: handcrafted_table
    source: m12_conj
  - id: m12_disj
    graph_type: handcrafted_table
    source: m12_disj
  - id: m12_fork
    graph_type: handcrafted_table
    source: m12_fork
  - id: m12_chain
    graph_type: handcrafted_table
    source: m12_chain

grid:
  seed: [0]
  # Ignored for handcrafted DGPs (per-fixture default_target wins: x2 for all
  # five fixtures). Present because grid.target is required.
  target: [x2]
  cell_dir: dgp

provenance:
  code_commit_required: true
